# =====================================================================
#  UltiDash - battery registry (template)
#
#  COPY THIS FILE TO  batteries.cfg  (same folder) AND EDIT IT.
#  UltiDash only reads batteries.cfg - this .example file is ignored,
#  so a widget update never overwrites your list.
#
#  Used by the flight log / battery management (Settings > General):
#    "Ask battery on connect"  -> after each connect UltiDash offers the
#                                 packs listed here for the current model
#    "Battery sets FC profile" -> selecting a pack activates its profile=
#    "Log flights to SD card"  -> the pack's id lands in flights.csv
#
#  One battery per line, fields separated by ';'. A '#' at the START of a
#  line makes the whole line a comment (elsewhere it is just a character).
#  Order of the fields does not matter; unknown fields are preserved.
#
#  FIELD     MEANING
#  ------    --------------------------------------------------------------
#  id        REQUIRED. Unique, any string, no ';' and no ','.
#            Simple counters (1, 2, 3 ...) are fine; an id from your own
#            external system works just as well and lets you match the
#            usage later (e.g. 96dded9b2f4b43f0). The id is what goes
#            into flights.csv - keep it stable once a pack is in use.
#  name      Display name on the radio (keep it short - it is one button
#            line, ~20 chars fit comfortably).
#  cap       Capacity in mAh. Shown on the query page - and with "Battery
#            sets FC profile" on it selects the FC battery profile whose
#            configured capacity matches (no profile= needed; first match
#            wins if two profiles share a capacity).
#  models    Comma list of model names this pack is offered for. Use the
#            FC-SET model name (what the dashboard shows as craft name),
#            case-insensitive. Empty or '*' = offered for every model.
#            Several models = the pack is shared, tracked under one id.
#  profile   OPTIONAL override: FC battery profile 1..6 activated when the
#            pack is picked, INSTEAD of the capacity match above. Only
#            needed when the capacities are ambiguous or not set in the FC
#            ("Battery sets FC profile" on; MSP write, disarmed only).
#  cycles    Maintained BY THE WIDGET: +1 once per battery session, on the
#  last      first logged flight; last=YYYY-MM-DD. Start them at 0 / empty,
#            or seed cycles= with a count from your old records.
#
#  Note: if a pack matches no model here it is simply not offered - the
#  query page then does not open at all for that model.
# =====================================================================

# --- simple counter ids, one model each ------------------------------
id=1;name=Tattu 6S 3700 A;cap=3700;models=Goblin 580;cycles=0;last=
id=2;name=Tattu 6S 3700 B;cap=3700;models=Goblin 580;cycles=0;last=

# --- explicit FC profile override (usually NOT needed: with "Battery
# --- sets FC profile" on, cap= already matches the FC profile) --------
id=3;name=SLS 12S 5000;cap=5000;models=Logo 700;profile=2;cycles=0;last=

# --- one pack shared by two models (same id -> combined tracking) -----
id=4;name=GNB 6S 3000;cap=3000;models=Goblin 380,Logo 550;cycles=0;last=

# --- id from an external system, offered for EVERY model -------------
id=96dded9b2f4b43f0;name=Bench pack;cap=1800;models=*;cycles=0;last=
